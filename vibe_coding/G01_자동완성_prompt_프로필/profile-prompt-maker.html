<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 프로필 사진 프롬프트 만들기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e7;color:#243b31;font:16px/1.6 system-ui,"Malgun Gothic",sans-serif}main{max-width:1080px;margin:auto;padding:clamp(18px,5vw,52px)}header{border-bottom:1px solid #c9d0bd;margin-bottom:24px;padding-bottom:16px}h1{font-size:clamp(27px,5vw,47px);line-height:1.2;letter-spacing:-.05em;margin:0 0 10px}p{margin:0;color:#4e6156}h2{font-size:19px;line-height:1.3;margin:0 0 12px}.row{display:flex;flex-wrap:wrap;gap:8px}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:16px;align-items:start}.panel{background:#fffdf6;border:1px solid #d4dacb;border-radius:18px;padding:clamp(14px,3vw,24px)}button{border:1px solid #a5b8a6;border-radius:9px;background:#e7eee3;color:#254135;font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:7px 13px;cursor:pointer}button[aria-pressed=true],.primary{background:#345d47;border-color:#345d47;color:white}button:focus-visible,textarea:focus-visible{outline:3px solid #a36b23;outline-offset:2px}.group+.group{margin-top:15px}.group h3{margin:0 0 6px;font-size:14px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bar h2{margin:0}textarea{margin:14px 0 10px;display:block;width:100%;min-height:232px;resize:vertical;padding:14px;border:1px solid #c4cebe;border-radius:10px;background:#f9f8ef;color:#243b31;font:inherit}#status{font-size:14px}.actions{margin-top:12px;align-items:center}#hint{margin-top:10px;font-size:14px}section:has(#result){position:sticky;top:14px}#preset{margin-bottom:14px}#edit-entry{margin-top:16px}#modes button{flex:1 1 140px}button:disabled{opacity:.55;cursor:default}#preset[hidden]{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}section:has(#result){position:static}textarea{min-height:170px}}
[hidden]{display:none!important}.group label{display:block;font-weight:600;margin-bottom:6px}input[type=text]{width:100%;border:1px solid #a5b8a6;border-radius:9px;padding:10px 12px;background:#fffdf6;color:inherit;font:inherit}.section-note{margin:8px 0 14px}.section-note:empty{display:none}
</style>
<main>
<header><h1>AI 프로필 사진 프롬프트 만들기</h1><p>콘셉트로 첫 이미지를 만들고, 원하는 부분을 골라 다듬으세요.</p></header>
<section class="panel"><h2>작업 선택</h2><div id="modes" class="row" role="group" aria-label="작업 선택"></div></section>
<div class="layout">
<section class="panel"><h2 id="step-title">직업 / 분위기 콘셉트</h2>
<p id="step-note" class="section-note"></p>
<div id="concept-panel">
<div class="row" id="concepts" role="group" aria-label="직업 / 분위기 콘셉트"></div>
<div class="group" style="margin-top:15px"><label for="custom">직업·콘셉트 직접 입력 (선택)</label>
<input type="text" id="custom" maxlength="160" placeholder="예: 친환경 브랜드 창업자">
</div>
<div class="group"><label><input type="checkbox" id="reference"> 얼굴 참고 사진 사용</label></div>
<button id="preset">강사 프로필 예시 적용</button>
</div>
<div class="group" id="edit-entry" hidden><label for="edit-custom" id="edit-label"></label><input type="text" id="edit-custom" maxlength="240"></div>
<div id="options"></div></section>
<section class="panel">
<div class="bar"><h2><label for="result">완성된 프롬프트</label></h2><div class="row" id="languages" role="group" aria-label="프롬프트 언어"></div></div>
<textarea id="result" readonly></textarea>
<div class="row actions"><button class="primary" id="copy">복사</button><span id="status" role="status"></span></div>
<p id="hint"></p>
</section>
</div>
</main>
<script>
"use strict";
const modes = {
  new: "프로필 사진 만들기", pose: "포즈 변경", expression: "표정 변경",
  background: "배경 바꾸기", style: "스타일 변경"
};
const groups = {
  use: ["용도", "Use", [
    ["인스타그램", "Instagram"], ["비즈니스", "business profile"], ["카카오톡", "KakaoTalk"], ["GPT 아이콘", "GPT icon"]
  ]],
  subject: ["아이콘 소재", "Subject", [
    ["인물", "portrait"], ["펼쳐진 책", "an open book"], ["펜", "a pen"], ["노트와 펜", "a notebook and pen"], ["전구", "a light bulb"], ["말풍선", "a speech bubble"]
  ]],
  pose: ["포즈", "Pose", [
    ["정면", "facing the camera"], ["살짝 옆모습", "slight three-quarter angle"], ["노트북으로 작업 중", "working on a laptop"]
  ]],
  expression: ["표정", "Expression", [
    ["자연스러운 미소", "natural smile"], ["밝은 웃음", "bright laugh"], ["차분한 표정", "calm expression"]
  ]],
  background: ["배경", "Background", [
    ["크림색 단색", "solid cream"], ["밝은 사무실", "bright office"], ["자연광 스튜디오", "studio with natural light"]
  ]],
  style: ["스타일", "Style", [
    ["실사", "photorealistic"], ["캐리커처", "caricature"], ["연필 스케치", "pencil sketch"], ["미니멀 아이콘", "minimal icon"]
  ]]
};
groups.use[2].push(
  ["강사 프로필","instructor profile"], ["강의계획서·소개서","course outline or professional introduction"],
  ["포스터·홍보물","poster or promotional material"], ["SNS·블로그 프로필","social media or blog profile"],
  ["퍼스널 브랜딩","personal branding"]
);
groups.ratio = ["사진 비율","Aspect ratio",[["1:1 정사각형","1:1 square"],["3:4 세로형","3:4 portrait"],["4:5 세로형","4:5 portrait"], ["2:3 세로형","2:3 portrait"], ["16:9 가로형","16:9 landscape"]]];
const presets = {
  "pose": [
    [
      "정면 직립",
      "stand upright facing the camera with relaxed shoulders"
    ],
    [
      "약간 옆으로",
      "turn the torso slightly to one side"
    ],
    [
      "팔짱 끼기",
      "stand with arms naturally crossed"
    ],
    [
      "편안하게 기대기",
      "lean casually with a relaxed posture"
    ],
    [
      "걷는 포즈",
      "capture a natural mid-stride pose"
    ],
    [
      "앉은 자세",
      "sit comfortably with relaxed shoulders"
    ],
    [
      "턱 괴기",
      "rest the chin lightly on one hand"
    ],
    [
      "다이내믹 포즈",
      "adopt a dynamic pose with a natural weight shift"
    ]
  ],
  "expression": [
    [
      "자신감 있는",
      "confident expression and steady gaze"
    ],
    [
      "따뜻한 미소",
      "warm, natural smile"
    ],
    [
      "진지한·차분한",
      "serious, composed expression"
    ],
    [
      "밝고 활발한",
      "bright, lively expression"
    ],
    [
      "신비롭고 차가운",
      "cool, enigmatic expression"
    ],
    [
      "부드럽고 온화한",
      "gentle, soft expression"
    ],
    [
      "강인하고 카리스마",
      "strong, charismatic expression"
    ],
    [
      "자연스러운 편안함",
      "relaxed, unposed expression"
    ]
  ],
  "background": [
    [
      "깔끔한 흰 배경",
      "clean, seamless white backdrop"
    ],
    [
      "그라데이션",
      "smooth, subtle gradient backdrop"
    ],
    [
      "오피스·도시 뷰",
      "modern office with a city view"
    ],
    [
      "자연·숲·공원",
      "green outdoor setting in a forest or park"
    ],
    [
      "카페·인테리어",
      "warm cafe interior"
    ],
    [
      "아웃포커스 보케",
      "defocused backdrop with soft bokeh"
    ],
    [
      "스튜디오 조명",
      "neutral studio backdrop with softly lit background"
    ],
    [
      "야경·네온",
      "nighttime city backdrop with neon accents"
    ]
  ],
  "style": [
    [
      "실사·사진 같은",
      "photorealistic portrait with natural textures"
    ],
    [
      "시네마틱·영화 같은",
      "cinematic look with film-inspired color and contrast"
    ],
    [
      "애니메이션풍",
      "animation-inspired portrait with clean shapes and expressive linework"
    ],
    [
      "일러스트·그림체",
      "hand-drawn illustration with visible artistic texture"
    ],
    [
      "빈티지·필름",
      "vintage analog film look with subtle grain"
    ],
    [
      "3D 렌더링",
      "stylized 3D rendering with dimensional shading"
    ],
    [
      "미니멀·모던",
      "minimal modern look with simplified forms and a restrained palette"
    ],
    [
      "판타지·몽환적",
      "dreamlike fantasy look with soft, atmospheric details"
    ]
  ]
};
for (const [key, choices] of Object.entries(presets)) groups[key][2] = choices;
const concepts = [
  ["전문직·비즈니스", "professional business portrait with a polished, trustworthy presence"],
  ["크리에이티브", "creative professional portrait with an expressive, original visual direction"],
  ["캐주얼·친근한", "relaxed, friendly portrait with an approachable presence"],
  ["럭셔리·고급스러운", "refined portrait with understated luxury"],
  ["학술·지성적", "thoughtful academic portrait with a quietly confident presence"],
  ["스포티·활동적", "sporty portrait with energetic, active character"],
  ["아티스틱·감성적", "artistic and emotive portrait"],
  ["테크·미래적", "modern technology professional portrait with a clean, forward-looking style"]
];
const base = {use:0, subject:0, ratio:0};
const changes = Object.fromEntries(Object.keys(presets).map(key => [key, {option:null, custom:""}]));
const example = {pose:"노트북을 들고 있는 포즈", expression:"살짝 놀란 듯한 생기 있는 표정", background:"제주도 바다가 보이는 테라스", style:"수채화 느낌의 따뜻한 톤"};
const preserve = {
  pose:["얼굴 특징, 표정, 의상, 배경과 전체 스타일","facial features, expression, clothing, background, and overall style"],
  expression:["얼굴 특징, 포즈, 의상, 배경과 구도","facial features, pose, clothing, background, and composition"],
  background:["인물의 얼굴과 표정, 포즈, 의상, 구도와 인물에 비치는 조명","the face, expression, pose, clothing, framing, and lighting on the subject"],
  style:["인물의 정체성과 알아볼 수 있는 얼굴 특징, 포즈, 표정, 의상 디자인, 배경 요소와 구도","the subject’s identity and recognizable facial features, pose, expression, clothing design, background elements, and composition"]
};
let concept = 0;
let language = 0;
let mode = "new";
const byId = id => document.getElementById(id);
const result = byId("result");
const status = byId("status");

function addButton(parent, label, active, onClick) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.setAttribute("aria-pressed", String(active));
  button.addEventListener("click", () => {
    onClick();
    [...parent.querySelectorAll("button")].find(item => item.textContent === label)?.focus();
  });
  parent.append(button);
}

function field(key, index) {
  return groups[key][language] + ": " + groups[key][2][index][language];
}

function renderPrompt() {
  const icon = base.use === 3;
  const objectIcon = icon && base.subject > 0;
  let lines;
  if (mode === "new") {
    const use = groups.use[2][base.use][language];
    const custom = byId("custom").value.trim();
    const theme = concept === null ? "" : concepts[concept][language];
    const reference = byId("reference").checked && !objectIcon;
    lines = [
      language ? "Create a profile image for " + use + "." : use + "에 사용할 프로필 이미지를 만들어줘.",
      theme ? (language ? "Concept: " : "콘셉트: ") + theme : "",
      custom && (language ? "Custom direction (use this if it differs from the preset): " : "직접 입력한 콘셉트 (선택한 콘셉트와 다르면 이 내용을 우선): ") + custom,
      field("ratio", icon ? 0 : base.ratio),
      icon ? field("subject", base.subject) : "",
      reference ? (language ? "Use the attached photo as a reference for the person’s identity and facial features." : "첨부한 사진을 인물의 정체성과 얼굴 특징을 살리기 위한 참고 이미지로 사용해줘.") : "",
      language ? "Keep the composition clean and omit text and logos." : "구도를 깔끔하게 잡고 글자와 로고는 생략해줘."
    ];
  } else {
    const {option, custom} = changes[mode];
    const label = groups[mode][language];
    const direction = custom.trim() || (option === null ? "" : groups[mode][2][option][language]);
    lines = direction ? [
      language
        ? "Edit the most recent profile image in this conversation. If none is available, use the attached image. Change only the " + label.toLowerCase() + "."
        : "이 대화에서 가장 최근에 만든 프로필 이미지를 수정해줘. 해당 이미지가 없으면 첨부한 이미지를 사용해줘. 아래 항목만 바꿔줘.",
      label + ": " + direction,
      language ? "Preserve " + preserve[mode][1] + ". Keep the original aspect ratio." : "다음 요소는 유지해줘. " + preserve[mode][0] + ". 원본 비율도 유지해줘."
    ] : [];
  }
  result.value = lines.filter(Boolean).join("\n\n");
  result.placeholder = "옵션을 선택하거나 원하는 내용을 직접 입력하세요.";
  result.lang = language ? "en" : "ko";
  byId("copy").disabled = !result.value;
  status.textContent = "";
}

function render() {
  const creating = mode === "new";
  const icon = base.use === 3;
  byId("reference").disabled = icon && base.subject > 0;
  byId("concept-panel").hidden = !creating;
  byId("edit-entry").hidden = creating;
  byId("step-title").textContent = creating ? "직업 / 분위기 콘셉트" : modes[mode];
  byId("step-note").textContent = creating
    ? "콘셉트를 선택한 뒤 프롬프트를 복사하세요."
    : "옵션을 고르거나 직접 입력하세요. 입력한 내용이 있으면 해당 내용을 우선 적용합니다.";
  byId("hint").textContent = creating
    ? "ChatGPT에 프롬프트를 붙여 넣어 이미지를 만든 뒤, 위에서 수정 메뉴를 선택하세요."
    : "이미지를 만든 채팅에 프롬프트를 붙여 넣으세요. 새 채팅이라면 수정할 이미지도 첨부하세요.";

  const menu = byId("modes");
  menu.replaceChildren();
  for (const [key, label] of Object.entries(modes)) {
    addButton(menu, label, mode === key, () => { mode = key; render(); });
  }

  const list = byId("concepts");
  list.replaceChildren();
  if (creating) {
    concepts.forEach(([label], index) => {
      addButton(list, label, concept === index, () => { concept = index; render(); });
    });
  } else {
    byId("edit-label").textContent = groups[mode][0] + " 직접 입력";
    byId("edit-custom").placeholder = "예: " + example[mode];
    byId("edit-custom").value = changes[mode].custom;
  }

  const languages = byId("languages");
  languages.replaceChildren();
  ["한국어", "English"].forEach((label, index) => {
    addButton(languages, label, language === index, () => { language = index; render(); });
  });

  const container = byId("options");
  const editEntry = byId("edit-entry");
  editEntry.remove();
  container.replaceChildren();
  for (const key of creating ? ["use", icon ? "subject" : "ratio"] : [mode]) {
    const group = document.createElement("div");
    group.className = "group";
    const heading = document.createElement("h3");
    heading.textContent = groups[key][0] + " 선택";
    const row = document.createElement("div");
    row.className = "row";
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", heading.textContent);
    group.append(heading, row);
    groups[key][2].forEach(([label], index) => {
      addButton(row, label, index === (creating ? base[key] : changes[key].option), () => {
        if (creating) base[key] = index;
        else {
          changes[key].option = index;
          changes[key].custom = "";
        }
        render();
      });
    });
    container.append(group);
  }
  container.append(editEntry);
  renderPrompt();
}

byId("custom").addEventListener("input", renderPrompt);
byId("reference").addEventListener("change", renderPrompt);
byId("edit-custom").addEventListener("input", event => {
  changes[mode].custom = event.target.value;
  renderPrompt();
});
byId("preset").addEventListener("click", () => {
  concept = 0;
  Object.assign(base, {use:4, ratio:2});
  byId("custom").value = "전문 강사·컨설턴트 / Professional instructor or consultant";
  render();
});

byId("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(result.value);
    status.textContent = "복사했어요.";
  } catch {
    result.focus();
    result.select();
    result.setSelectionRange(0, result.value.length);
    let copied = false;
    try { copied = document.execCommand("copy"); } catch {}
    status.textContent = copied ? "복사했어요." : "선택한 문장을 Ctrl+C 또는 길게 눌러 복사하세요.";
  }
});
render();
</script>
</html>
