<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 프로필 사진 프롬프트 만들기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e7;color:#243b31;font:16px/1.6 system-ui,"Malgun Gothic",sans-serif}main{max-width:1080px;margin:auto;padding:clamp(18px,5vw,52px)}header{border-bottom:1px solid #c9d0bd;margin-bottom:24px;padding-bottom:16px}h1{font-size:clamp(27px,5vw,47px);line-height:1.2;letter-spacing:-.05em;margin:0 0 10px}p{margin:0;color:#4e6156}h2{font-size:19px;line-height:1.3;margin:0 0 12px}.row{display:flex;flex-wrap:wrap;gap:8px}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:16px;align-items:start}.panel{background:#fffdf6;border:1px solid #d4dacb;border-radius:18px;padding:clamp(14px,3vw,24px)}button{border:1px solid #a5b8a6;border-radius:9px;background:#e7eee3;color:#254135;font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:7px 13px;cursor:pointer}button[aria-pressed=true],.primary{background:#345d47;border-color:#345d47;color:white}button:focus-visible,textarea:focus-visible{outline:3px solid #a36b23;outline-offset:2px}.group+.group{margin-top:15px}.group h3{margin:0 0 6px;font-size:14px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bar h2{margin:0}textarea{margin:14px 0 10px;display:block;width:100%;min-height:232px;resize:vertical;padding:14px;border:1px solid #c4cebe;border-radius:10px;background:#f9f8ef;color:#243b31;font:inherit}#status{font-size:14px}.actions{margin-top:12px;align-items:center}#hint{margin-top:10px;font-size:14px}@media(max-width:700px){.layout{grid-template-columns:1fr}textarea{min-height:170px}}
</style>
<main>
<header><h1>AI 프로필 사진 프롬프트 만들기</h1><p>작업과 옵션을 선택하고 프롬프트를 복사하세요.</p></header>
<section class="panel"><h2>작업 선택</h2><div id="modes" class="row" role="group" aria-label="작업 선택"></div></section>
<div class="layout">
<section class="panel"><h2>옵션</h2><div id="options"></div></section>
<section class="panel">
<div class="bar"><h2><label for="result">완성된 프롬프트</label></h2><div class="row" id="languages" role="group" aria-label="프롬프트 언어"></div></div>
<textarea id="result" readonly></textarea>
<div class="row actions"><button class="primary" id="copy">복사</button><span id="status" role="status"></span></div>
<p id="hint"></p>
</section>
</div>
</main>
<script>
"use strict";
const modes = {
  new: "새 프로필 사진 만들기", pose: "포즈 변경", expression: "표정 변경",
  background: "배경 바꾸기", style: "스타일 변경"
};
const groups = {
  use: ["용도", "Use", [
    ["인스타그램", "Instagram"], ["비즈니스", "business profile"], ["카카오톡", "KakaoTalk"], ["GPT 아이콘", "GPT icon"]
  ]],
  subject: ["아이콘 소재", "Subject", [
    ["인물", "portrait"], ["펼쳐진 책", "an open book"], ["펜", "a pen"], ["노트와 펜", "a notebook and pen"]
  ]],
  pose: ["포즈", "Pose", [
    ["정면", "facing the camera"], ["살짝 옆모습", "slight three-quarter angle"], ["노트북으로 작업 중", "working on a laptop"]
  ]],
  expression: ["표정", "Expression", [
    ["자연스러운 미소", "natural smile"], ["밝은 웃음", "bright laugh"], ["차분한 표정", "calm expression"]
  ]],
  background: ["배경", "Background", [
    ["크림색 단색", "solid cream"], ["밝은 사무실", "bright office"], ["자연광 스튜디오", "studio with natural light"]
  ]],
  style: ["스타일", "Style", [
    ["실사", "photorealistic"], ["캐리커처", "caricature"], ["연필 스케치", "pencil sketch"], ["미니멀 아이콘", "minimal icon"]
  ]]
};
const preserved = {
  pose: ["인물의 정체성과 얼굴 특징, 표정, 의상, 배경, 색감과 전체 스타일", "the person's identity and facial features, expression, outfit, background, color palette, and overall style"],
  expression: ["인물의 정체성과 얼굴 특징, 포즈, 의상, 배경, 구도와 전체 스타일", "the person's identity and facial features, pose, outfit, background, framing, and overall style"],
  background: ["인물의 얼굴, 포즈, 표정, 의상, 구도와 전체 스타일", "the person's face, pose, expression, outfit, framing, and overall style"],
  style: ["원본의 인물이나 소재, 인물의 정체성과 얼굴 특징, 포즈, 표정, 의상, 배경 요소와 구도", "the original subject, any person's identity and facial features, pose, expression, outfit, background elements, and composition"]
};
const defaults = {use:0, subject:0, pose:0, expression:0, background:0, style:0};
const selections = {new:{...defaults}, pose:{pose:0}, expression:{expression:0}, background:{background:0}, style:{style:0}};
let mode = "new";
let language = 0;
const byId = id => document.getElementById(id);
const result = byId("result");
const status = byId("status");

function addButton(parent, label, selected, onClick) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.setAttribute("aria-pressed", String(selected));
  button.addEventListener("click", () => {
    onClick();
    const updated = [...document.querySelectorAll("button[aria-pressed=true]")]
      .find(item => item.textContent === label);
    updated?.focus();
  });
  parent.append(button);
}

function render() {
  const choice = selections[mode];
  const value = key => groups[key][2][choice[key]][language];
  const icon = mode === "new" && choice.use === 3;
  const objectIcon = icon && choice.subject > 0;
  const optionKeys = mode === "new"
    ? ["use", ...(icon ? ["subject"] : []), ...(objectIcon ? [] : ["pose", "expression"]), "background", "style"]
    : [mode];

  byId("modes").replaceChildren();
  for (const [key, label] of Object.entries(modes)) {
    addButton(byId("modes"), label, key === mode, () => { mode = key; render(); });
  }

  byId("languages").replaceChildren();
  ["한국어", "English"].forEach((label, index) => {
    addButton(byId("languages"), label, index === language, () => { language = index; render(); });
  });

  byId("options").replaceChildren();
  for (const key of optionKeys) {
    const group = document.createElement("div");
    group.className = "group";
    const heading = document.createElement("h3");
    heading.id = "heading-" + key;
    heading.textContent = groups[key][0];
    const row = document.createElement("div");
    row.className = "row";
    row.setAttribute("role", "group");
    row.setAttribute("aria-labelledby", heading.id);
    group.append(heading, row);
    groups[key][2].forEach(([label], index) => {
      addButton(row, label, index === choice[key], () => {
        if (key === "use" && index === 3 && choice.style === 0) choice.style = 3;
        choice[key] = index;
        render();
      });
    });
    byId("options").append(group);
  }

  const fields = optionKeys.filter(key => key !== "use").map(key => groups[key][language] + ": " + value(key)).join("\n");
  if (mode === "new") {
    result.value = language
      ? ["Create a square 1:1 profile image for " + value("use") + ".", fields, "Center the subject with enough margin for a circular crop. Omit text and logos."].join("\n\n")
      : [value("use") + "용 1:1 정사각형 프로필 이미지를 만들어줘.", fields, "원형으로 잘려도 잘 보이도록 피사체를 중앙에 두고 주변에 여백을 남겨줘. 글자와 로고는 생략해줘."].join("\n\n");
  } else {
    result.value = language
      ? ["Edit the attached photo. Change only the " + groups[mode][1].toLowerCase() + ".", fields, "Preserve " + preserved[mode][1] + ". Keep the original aspect ratio."].join("\n\n")
      : ["첨부한 사진에서 아래 항목만 바꿔줘.", fields, preserved[mode][0] + ", 원본 비율을 유지해줘."].join("\n\n");
  }
  byId("hint").textContent = mode === "new"
    ? "복사한 프롬프트를 이미지 생성 채팅에 붙여 넣으세요."
    : "이미지 편집 채팅에 원본 사진을 첨부하고 프롬프트를 붙여 넣으세요.";
  result.lang = language ? "en" : "ko";
  status.textContent = "";
}

byId("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(result.value);
    status.textContent = "복사했어요.";
  } catch {
    result.focus();
    result.select();
    result.setSelectionRange(0, result.value.length);
    let copied = false;
    try { copied = document.execCommand("copy"); } catch {}
    status.textContent = copied ? "복사했어요." : "선택한 문장을 Ctrl+C 또는 길게 눌러 복사하세요.";
  }
});
render();
</script>
</html>
