<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미디어 자료실 | Media Library</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#14283d;font:16px/1.55 system-ui,sans-serif}header{background:#14283d;color:white;padding:24px clamp(16px,4vw,56px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1,h2,p{margin:0}h1{font-size:28px}h2{font-size:17px;margin-top:24px}header p{color:#d4e3ef}main{display:grid;grid-template-columns:minmax(245px,330px) minmax(0,1fr);gap:18px;padding:clamp(12px,3vw,36px)}aside,article{background:white;border:1px solid #d7e2eb;border-radius:14px;padding:16px;min-width:0}button,select,.link{font:inherit;padding:8px 12px;border:1px solid #b8cbdc;border-radius:8px;background:white;color:#14283d}button,.link{cursor:pointer}button:disabled{opacity:.55;cursor:default}#pick{background:#176489;color:white;border-color:#176489;font-weight:700}select{width:100%;margin-top:8px}ul{list-style:none;margin:8px 0 0;padding:0}li+li{margin-top:6px}li button{width:100%;text-align:left;overflow-wrap:anywhere}li button[aria-current=true]{background:#dceff9;border-color:#176489}#path,#status,#title{overflow-wrap:anywhere}#path{margin-top:10px;font-weight:700;background:#edf3f8;border-radius:6px;padding:8px 10px;font-size:14px}#status{font-size:14px;margin-top:8px;color:#405970}.reader-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}.stage{min-height:74vh;background:#f6f9fc;border:1px solid #d7e2eb;border-radius:8px;display:grid;place-items:center;padding:12px}.stage img,.stage video{display:block;max-width:100%;max-height:74vh;object-fit:contain}.stage video{width:100%;background:#000}#info{font-size:14px;color:#405970;margin-top:10px}[hidden]{display:none!important}@media(max-width:680px){main{grid-template-columns:1fr}.stage{min-height:40vh}}

.image-nav{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:10px;background:#edf3f8;border:1px solid #d7e2eb;border-radius:9px}.image-nav button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px;font-size:14px;font-weight:600}.image-nav button:not(:disabled):hover{background:#dceff9;border-color:#176489}.image-nav button:disabled{opacity:.36}.image-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.image-nav output{min-width:76px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}.image-nav button:focus-visible{outline:2px solid #176489;outline-offset:2px}@media(max-width:480px){.image-nav{gap:4px}.image-nav button{padding:6px}.image-nav output{min-width:50px}}
</style></head><body><header><div><h1>미디어 자료실 | Media Library</h1><p>폴더를 선택하고 이미지와 동영상을 열어 보세요.</p></div><button id="pick">자료 폴더 선택</button><input id="upload" type="file" webkitdirectory multiple hidden></header><main><aside aria-label="폴더 및 미디어 탐색"><button id="back" disabled>← 이전</button><p id="status" role="status"></p><h2><label for="folders">하위 폴더</label></h2><select id="folders" disabled><option>폴더를 선택하세요</option></select><p id="path">선택한 폴더 없음</p><h2>이미지 파일 <span id="ic"></span></h2><ul id="images"></ul><p id="ie">자료 폴더를 먼저 선택하세요.</p><h2>동영상 파일 <span id="vc"></span></h2><ul id="videos"></ul><p id="ve">자료 폴더를 먼저 선택하세요.</p></aside><article aria-label="미디어 미리보기"><div class="reader-head"><strong id="title">미디어 미리보기</strong><a class="link" id="external" target="_blank" rel="noopener" hidden>새 탭에서 열기</a></div><nav class="image-nav" id="image-nav" aria-label="이미지 순서 이동" hidden><button type="button" id="first" title="처음 이미지" aria-label="처음 이미지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14"/><path d="m18 5-7 7 7 7"/></svg><span>처음</span></button><button type="button" id="prev" title="이전 이미지" aria-label="이전 이미지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>이전</span></button><output id="position" aria-live="polite"></output><button type="button" id="next" title="다음 이미지" aria-label="다음 이미지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg><span>다음</span></button><button type="button" id="last" title="마지막 이미지" aria-label="마지막 이미지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14"/><path d="m6 5 7 7-7 7"/></svg><span>마지막</span></button></nav><div class="stage"><p id="hint">목록에서 파일을 누르면 여기에 표시됩니다.</p><img id="image" alt="선택한 이미지" hidden><video id="video" controls playsinline preload="metadata" hidden></video></div><p id="info" role="status"></p></article></main><script>
'use strict';const $=id=>document.getElementById(id), image=$('image'),video=$('video'),folders=$('folders'),status=$('status');const isImage=n=>/\.(jpe?g|png|gif|webp|svg|avif|bmp|ico)$/i.test(n),isVideo=n=>/\.(mp4|m4v|webm|ogv|ogg|mov|mkv|avi|wmv|mpeg|mpg|3gp)$/i.test(n);const collator=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});let trail=[],url,nav=0,request=0,imageItems=[],currentImage=-1;
function updateImageNav(index){currentImage=index;$('image-nav').hidden=index<0;if(index<0)return;$('position').textContent=(index+1)+' / '+imageItems.length;$('first').disabled=$('prev').disabled=index===0;$('next').disabled=$('last').disabled=index===imageItems.length-1;}
function goImage(index){if(index<0||index>=imageItems.length||index===currentImage)return;const item=imageItems[index];openFile(item.entry,item.button,'image');}
$('first').onclick=()=>goImage(0);$('prev').onclick=()=>goImage(currentImage-1);$('next').onclick=()=>goImage(currentImage+1);$('last').onclick=()=>goImage(imageItems.length-1);

function clear(){request++;updateImageNav(-1);video.pause();image.hidden=video.hidden=$('external').hidden=true;image.onload=image.onerror=video.onloadedmetadata=video.onerror=null;image.removeAttribute('src');video.removeAttribute('src');video.load();$('external').removeAttribute('href');if(url)URL.revokeObjectURL(url);url=null;$('hint').hidden=false;$('hint').textContent='목록에서 파일을 누르면 여기에 표시됩니다.';$('title').textContent='미디어 미리보기';$('info').textContent='';document.querySelector('[aria-current=true]')?.removeAttribute('aria-current');}
async function openFile(entry,button,kind){clear();const token=request;if(kind==='image'){updateImageNav(imageItems.findIndex(item=>item.button===button));button.setAttribute('aria-current','true');$('title').textContent=entry.name;}try{const file=await entry.getFile();if(token!==request)return;const mime={mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',ogv:'video/ogg',ogg:'video/ogg',mov:'video/quicktime',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',avif:'image/avif',bmp:'image/bmp',ico:'image/x-icon'}[entry.name.split('.').pop().toLowerCase()];url=URL.createObjectURL(!file.type&&mime?file.slice(0,file.size,mime):file);const el=kind==='image'?image:video;const size=(file.size/1048576).toFixed(2)+' MB';$('info').textContent=size;el.onerror=()=>{if(token===request)$('info').textContent='이 파일을 표시하거나 재생할 수 없습니다. 파일 손상 또는 브라우저의 형식·코덱 지원 여부를 확인하세요.';};if(kind==='image')image.onload=()=>{$('info').textContent=image.naturalWidth+' × '+image.naturalHeight+' px · '+size;};else video.onloadedmetadata=()=>{$('info').textContent=video.videoWidth+' × '+video.videoHeight+' px · '+size;};$('hint').hidden=true;el.hidden=false;$('external').href=url;$('external').hidden=false;$('title').textContent=entry.name;button.setAttribute('aria-current','true');el.src=url;if(kind==='video')video.play().catch(()=>{if(token===request&&!video.error)$('info').textContent=size+' · 재생 버튼을 눌러 시작하세요.';});}catch(e){if(token===request)$('info').textContent='파일을 열 수 없습니다. 접근 권한을 확인하세요.';}}
function render(entries,kind){const img=kind==='image',list=$(img?'images':'videos');list.replaceChildren();if(img)imageItems=[];$(img?'ic':'vc').textContent='('+entries.length+')';$(img?'ie':'ve').hidden=entries.length>0;$(img?'ie':'ve').textContent='이 폴더에 해당 파일이 없습니다.';for(const entry of entries){const li=document.createElement('li'),b=document.createElement('button');b.textContent=(img?'🖼️ ':'▶ ')+entry.name;b.onclick=()=>openFile(entry,b,kind);if(img)imageItems.push({entry,button:b});li.append(b);list.append(li);}}
async function show(next){const token=++nav;status.textContent='폴더를 읽는 중입니다.';folders.disabled=$('back').disabled=true;try{const entries=[];for await(const e of next.at(-1).values())entries.push(e);if(token!==nav)return;trail=next;clear();entries.sort((a,b)=>collator.compare(a.name,b.name));const children=entries.filter(e=>e.kind==='directory'),files=entries.filter(e=>e.kind==='file');folders.replaceChildren(new Option(children.length?'하위 폴더 선택':'하위 폴더 없음',''));children.forEach((e,i)=>folders.add(new Option(e.name,String(i))));folders.onchange=()=>{if(folders.value!=='')show([...trail,children[Number(folders.value)]]);};folders.disabled=!children.length;$('back').disabled=trail.length<2;$('path').textContent=trail.map(e=>e.name).join(' / ');render(files.filter(e=>isImage(e.name)),'image');render(files.filter(e=>isVideo(e.name)),'video');status.textContent='폴더 불러오기 완료';const firstImage=imageItems[0];const firstVideo=$('videos').querySelector('button');if(firstImage)await openFile(firstImage.entry,firstImage.button,'image');else if(firstVideo)firstVideo.click();}catch(e){if(token===nav){status.textContent='폴더를 읽을 수 없습니다.';$('back').disabled=trail.length<2;folders.disabled=folders.options.length<2;}}}
function folder(name){const entries=new Map();return{name,entries,kind:'directory',values:()=>entries.values()};}$('upload').onchange=()=>{const all=Array.from($('upload').files);$('upload').value='';if(!all.length)return;const root=folder(all[0].webkitRelativePath.split('/')[0]);for(const file of all){const parts=file.webkitRelativePath.split('/').slice(1),name=parts.pop();let f=root;for(const p of parts){if(!f.entries.has(p))f.entries.set(p,folder(p));f=f.entries.get(p);}f.entries.set(name,{name,kind:'file',getFile:()=>file});}show([root]);};$('pick').onclick=async()=>{if(!window.showDirectoryPicker){$('upload').click();return;}try{await show([await window.showDirectoryPicker({mode:'read'})]);}catch(e){if(e.name!=='AbortError'){$('upload').click();}}};$('back').onclick=()=>{if(trail.length>1)show(trail.slice(0,-1));};
</script></body></html>
